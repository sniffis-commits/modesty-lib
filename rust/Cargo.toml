[package]
name = "nsfw-lib-rust"
version = "0.1.0"
edition = "2021"
description = "Modesty NSFW scanner - Rust mirror of nsfw-lib Python scanner"
license = "MIT"

[dependencies]
# Image decoding and preprocessing (no C deps)
image = "0.25"
# N-dimensional arrays for ONNX tensor I/O (no C deps)
ndarray = "0.15"
# JSON serialization for Native Messaging protocol
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Optional ONNX Runtime - requires a C compiler (MSVC/gcc). The binaries are
# downloaded at build time unless ORT_LIB_LOCATION points at a local ONNX
# Runtime release (see build_msvc.bat).
# Enable with: cargo build --features onnx
ort = { version = "2.0.0-rc.15", optional = true, features = ["copy-dylibs"] }

# HTTP client for model download (feature-gated)
reqwest = { version = "0.11", features = ["blocking", "json"], optional = true }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winbase", "winnt", "handleapi", "fileapi", "memoryapi", "synchapi", "errhandlingapi"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lib]
name = "nsfw_lib_rust"
crate-type = ["cdylib", "rlib"]

[features]
default = []
onnx = ["dep:ort"]
download = ["dep:reqwest"]

[profile.release]
lto = true
opt-level = 3
strip = true