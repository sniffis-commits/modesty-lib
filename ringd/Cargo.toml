[package]
name = "nsfw-ringd"
version = "0.1.0"
edition = "2021"
description = "Modesty shared-memory ring daemon for buffered frame transport"
license = "MIT"

[dependencies]
# Cross-platform shared memory
memmap2 = "0.9"
# CLI
clap = { version = "4.5", features = ["derive"] }
# Logging
env_logger = "0.11"
log = "0.4"
# Serialization for frame metadata
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
thiserror = "2"
# Async
tokio = { version = "1.40", features = ["full"] }

[profile.release]
lto = true
opt-level = 3
strip = true

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winbase", "winnt", "handleapi", "fileapi", "memoryapi", "synchapi", "errhandlingapi"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"